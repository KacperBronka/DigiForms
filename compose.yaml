x-hardening: &hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *hardening
    build:
      context: ./parser-server
      dockerfile: Dockerfile
    user: "10001:10001"
    environment:
      EDENAI_API_KEY: "${EDENAI_API_KEY:?Set EDENAI_API_KEY at runtime}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-20971520}"
      EDENAI_API_URL: "${EDENAI_API_URL:-https://api.edenai.run/v3/chat/completions}"
      EDENAI_MODEL: "${EDENAI_MODEL:-amazon/anthropic.claude-haiku-5-5@eu}"
      EDENAI_CONNECT_TIMEOUT_SECONDS: "${EDENAI_CONNECT_TIMEOUT_SECONDS:-15}"
      EDENAI_READ_TIMEOUT_SECONDS: "${EDENAI_READ_TIMEOUT_SECONDS:-600}"
      MAX_OCR_CHARS: "${MAX_OCR_CHARS:-160000}"
      MAX_IMAGE_PAGES: "${MAX_IMAGE_PAGES:-5}"
      IMAGE_DPI: "${IMAGE_DPI:-150}"
      JPEG_QUALITY: "${JPEG_QUALITY:-78}"
      OCR_LANG: "${OCR_LANG:-pl}"
      OCR_DPI: "${OCR_DPI:-200}"
      OCR_TIMEOUT_SECONDS: "${OCR_TIMEOUT_SECONDS:-120}"
      OCR_THREADS: "${OCR_THREADS:-4}"
      JWT_ENABLED: "${JWT_ENABLED:-false}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:-}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-RS256}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      JWT_LEEWAY_SECONDS: "${JWT_LEEWAY_SECONDS:-30}"
      PORT: "3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${PARSER_TMP_SIZE:-1g},mode=1777
      # LibreOffice preferences only; models are read from the image.
      - /home/app:rw,nosuid,nodev,size=${APP_HOME_SIZE:-64m},uid=10001,gid=10001,mode=0700
    pids_limit: 512
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Local models are bundled in the image; allow time for OCR initialization.
      start_period: 2m

  front-server:
    <<: *hardening
    build:
      context: ./front-server
      dockerfile: Dockerfile
    user: nginx
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    pids_limit: 128
    networks:
      - ingress
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ingress:
  backend:
    internal: true
  # Only the parser requires egress for the accepted Eden AI integration.
  egress:
