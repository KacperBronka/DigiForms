server {
    listen 3000;
    # The application enforces the configurable file limit (multipart adds overhead).
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/process-document {
        # nginx requires a finite timeout; use its maximum timer interval.
        proxy_read_timeout 2147483s;
        proxy_pass http://front-server:3000;
    }

    # The parser is reachable only by the frontend over the backend network.
    location = /api { return 404; }
    location /api/ { return 404; }

    location / {
        proxy_pass http://front-server:3000;
    }
}
