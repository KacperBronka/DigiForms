# Runtime template rendered by the official nginx image entrypoint.
# Empty keys are not counted: both upload routes share one per-IP budget.
map $uri $upload_limit_key {
    default "";
    ~^/api/(upload|process-document)/?$ $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=requests_per_ip:10m rate=${RATE_LIMIT_RPS}r/s;
limit_req_zone $upload_limit_key zone=uploads_per_ip:10m rate=${UPLOAD_RATE_LIMIT_RPM}r/m;

log_format structured escape=json '{"timestamp":"$time_iso8601","service":"proxy","request_id":"$request_id","method":"$request_method","status":$status,"duration_seconds":$request_time,"rate_limit":"$limit_req_status"}';

server {
    access_log /dev/stdout structured;
    # Request outcomes are logged above without URLs/query strings or headers.
    error_log /dev/stderr crit;
    listen 3000;
    limit_req zone=requests_per_ip burst=${RATE_LIMIT_BURST} nodelay;
    limit_req zone=uploads_per_ip burst=${UPLOAD_RATE_LIMIT_BURST} nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Zbyt wiele żądań. Spróbuj ponownie później."}';
    }

    # Application enforces MAX_UPLOAD_BYTES (including streamed requests).
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    add_header X-Request-ID $request_id always;
    proxy_hide_header X-Request-ID;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/process-document {
        proxy_pass http://front-server:3000;
    }

    location /api/auth/ {
        proxy_pass http://front-server:3000;
    }

    location = /api/auth {
        proxy_pass http://front-server:3000;
    }

    location = /api {
        proxy_pass http://app:3000/;
    }

    location /api/ {
        proxy_pass http://app:3000/;
    }

    location / {
        proxy_pass http://front-server:3000;
    }
}
