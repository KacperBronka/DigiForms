server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # The application validates the configured file size; multipart adds overhead.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/process-document {
        proxy_read_timeout 2147483s;
        proxy_pass http://app:3000/api/process-document;
    }
    location = /api { return 404; }
    location /api/ { return 404; }

    location = /health { access_log off; return 200 'ready'; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
